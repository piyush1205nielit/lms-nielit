<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance — NIELIT Delhi LMS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #050b1a 0%, #0a1a3d 45%, #0d1f52 100%);
            padding: 20px;
        }
        .maint-card {
            background: white; border-radius: 20px; padding: 48px 40px;
            max-width: 480px; width: 100%; text-align: center;
            box-shadow: 0 30px 70px rgba(0,0,0,0.4);
        }
        .maint-icon {
            width: 76px; height: 76px; border-radius: 20px;
            background: #fffbeb; color: #f59e0b;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; margin: 0 auto 22px;
        }
        h1 { font-size: 1.4rem; color: #0e1b2e; margin-bottom: 12px; }
        p.maint-message { font-size: 0.92rem; color: #64748b; line-height: 1.7; margin-bottom: 20px; }
        .maint-eta {
            display: inline-flex; align-items: center; gap: 8px;
            background: #eaf1fb; color: #172281; font-size: 0.84rem; font-weight: 600;
            padding: 8px 18px; border-radius: 20px; margin-bottom: 20px;
        }
        .maint-footer { font-size: 0.76rem; color: #94a3b8; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="maint-card">
        <div class="maint-icon"><i class="fas fa-tools"></i></div>
        <h1>We'll Be Right Back</h1>
        <p class="maint-message">{{ maintenance.message }}</p>
        {% if maintenance.estimated_end_time %}
            <div class="maint-eta"><i class="fas fa-clock"></i> Expected back: {{ maintenance.estimated_end_time|date:"d M Y, g:i A" }}</div>
        {% endif %}
        <p class="maint-footer">NIELIT Delhi LMS &mdash; Thank you for your patience.</p>
    </div>
</body>
</html>
