{% if active_domains %}
<section class="home-domains-marquee" id="explore-domains">
    <div class="container position-relative">
        <div class="section-header reveal-up">
            <span class="section-eyebrow domains-eyebrow">
                <i class="fas fa-layer-group me-1"></i> Browse by Interest
            </span>

            <h2 class="section-title">Explore Technology Domains</h2>

            <p class="section-desc">
                Jump straight into the subject area you care about.
            </p>
        </div>
    </div>

    <div class="domain-marquee-wrap reveal-up">
        <div class="domain-marquee-track">

            <!-- First set -->
            {% for domain in active_domains %}
                <a href="{% url 'public:domain_courses' domain.slug %}"
                   class="domain-tile {% cycle 'domain-tile-c0' 'domain-tile-c1' 'domain-tile-c2' 'domain-tile-c3' 'domain-tile-c4' 'domain-tile-c5' %}">
                    <i class="fas fa-hashtag"></i>
                    {{ domain.name }}
                </a>
            {% endfor %}

            <!-- Duplicate set for infinite marquee -->
            {% for domain in active_domains %}
                <a href="{% url 'public:domain_courses' domain.slug %}"
                   class="domain-tile {% cycle 'domain-tile-c0' 'domain-tile-c1' 'domain-tile-c2' 'domain-tile-c3' 'domain-tile-c4' 'domain-tile-c5' %}"
                   aria-hidden="true"
                   tabindex="-1">
                    <i class="fas fa-hashtag"></i>
                    {{ domain.name }}
                </a>
            {% endfor %}

        </div>
    </div>
</section>

<style>
    /* =========================================================
       SECTION
    ========================================================= */

    .home-domains-marquee {
        padding: 72px 0 76px;
        background: linear-gradient(
            180deg,
            #ffffff 0%,
            #f8f9fc 100%
        );
        overflow: hidden;
    }

    .domains-eyebrow {
        color: #6d28d9;
        background: #f4effe;
        border-color: #e0d3fb;
    }

    .home-domains-marquee .section-title::after {
        background: linear-gradient(
            90deg,
            #7c3aed,
            #172281
        );
    }


    /* =========================================================
       MARQUEE WRAPPER
    ========================================================= */

    .domain-marquee-wrap {
        margin-top: 42px;
        overflow: hidden;
        position: relative;

        mask-image: linear-gradient(
            90deg,
            transparent,
            black 60px,
            black calc(100% - 60px),
            transparent
        );

        -webkit-mask-image: linear-gradient(
            90deg,
            transparent,
            black 60px,
            black calc(100% - 60px),
            transparent
        );
    }


    /* =========================================================
       MARQUEE TRACK
    ========================================================= */

    .domain-marquee-track {
        display: flex;
        align-items: center;
        gap: 16px;

        width: max-content;

        animation: domain-scroll 25s linear infinite;

        /*
         * Prevent other styles from making the background
         * transparent/white.
         */
        background: transparent !important;
    }

    .domain-marquee-wrap:hover .domain-marquee-track {
        animation-play-state: paused;
    }

    @keyframes domain-scroll {
        from {
            transform: translateX(0);
        }

        to {
            transform: translateX(-50%);
        }
    }


    /* =========================================================
       DOMAIN TILE - BASE
    ========================================================= */

    .home-domains-marquee .domain-tile {
        display: inline-flex;
        align-items: center;
        gap: 8px;

        padding: 14px 26px;

        border-radius: 14px;

        font-size: 0.92rem;
        font-weight: 700;

        color: #ffffff !important;

        text-decoration: none;

        white-space: nowrap;

        border: none;

        box-shadow:
            0 8px 18px rgba(15, 23, 42, 0.12);

        transition:
            transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
            box-shadow 0.3s ease,
            filter 0.3s ease;
    }

    .home-domains-marquee .domain-tile i {
        font-size: 0.78rem;
        opacity: 0.85;
    }

    .home-domains-marquee .domain-tile:hover {
        color: #ffffff !important;

        transform:
            translateY(-6px)
            scale(1.06);

        box-shadow:
            0 16px 30px rgba(15, 23, 42, 0.22);

        filter: brightness(1.06);
    }


    /* =========================================================
       DOMAIN TILE COLORS
    ========================================================= */

    .home-domains-marquee .domain-tile-c0 {
        background: linear-gradient(
            135deg,
            #172281,
            #3346c9
        ) !important;
    }

    .home-domains-marquee .domain-tile-c1 {
        background: linear-gradient(
            135deg,
            #0f766e,
            #14b8a6
        ) !important;
    }

    .home-domains-marquee .domain-tile-c2 {
        background: linear-gradient(
            135deg,
            #b45309,
            #f59e0b
        ) !important;
    }

    .home-domains-marquee .domain-tile-c3 {
        background: linear-gradient(
            135deg,
            #7c2d92,
            #c026d3
        ) !important;
    }

    .home-domains-marquee .domain-tile-c4 {
        background: linear-gradient(
            135deg,
            #b91c1c,
            #f97316
        ) !important;
    }

    .home-domains-marquee .domain-tile-c5 {
        background: linear-gradient(
            135deg,
            #1e40af,
            #06b6d4
        ) !important;
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 576px) {

        .home-domains-marquee {
            padding: 48px 0 56px;
        }

        .home-domains-marquee .domain-tile {
            padding: 11px 20px;
            font-size: 0.84rem;
        }

        .domain-marquee-track {
            gap: 12px;
        }
    }


    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {

        .domain-marquee-track {
            animation: none;
        }
    }
</style>

<script>
(function () {

    const targets = document.querySelectorAll(
        '#explore-domains .reveal-up'
    );

    if (
        !('IntersectionObserver' in window) ||
        targets.length === 0
    ) {
        targets.forEach(function (el) {
            el.classList.add('is-visible');
        });

        return;
    }

    const io = new IntersectionObserver(
        function (entries) {

            entries.forEach(function (entry) {

                if (entry.isIntersecting) {

                    entry.target.classList.add('is-visible');

                    io.unobserve(entry.target);
                }

            });

        },
        {
            threshold: 0.1
        }
    );

    targets.forEach(function (el) {
        io.observe(el);
    });

})();
</script>

{% endif %}
