{% extends 'public/base.html' %}
{% block content %}
<div class="container py-5" style="max-width: 560px;">
    <div class="text-center p-5 rounded-4" style="background: white; border: 1px solid #e2e8f0;">
        <i class="fas fa-hourglass-half" style="font-size: 3rem; color: #f59e0b;"></i>
        <h3 class="mt-3 fw-bold">Pending for Approval by Admin</h3>
        <p class="text-muted">
            Your registration has been received. An administrator will review and
            approve your account before you can log in. You'll be notified by email
            once your access is granted.
        </p>
        <a href="{% url 'public:home' %}" class="btn btn-outline-primary mt-2">Back to Home</a>
    </div>
</div>
{% endblock %}
